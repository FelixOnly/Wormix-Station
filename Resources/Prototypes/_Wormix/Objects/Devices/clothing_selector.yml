# Шарфы
- type: entity
  id: UndeterminedClothingScarf
  name: scarf selector
  description: A small remote utilizing bluespace technology to drop in a hardsuit or modsuit of your choosing.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    layers:
      - sprite: _ADT/Clothing/Neck/Scarfs/white.rsi
        state: icon
      - sprite: _ADT/Objects/Specific/clothing_voucher.rsi
        state: icon
  - type: SetSelector
    possibleSets:
    - ClothingSelectorClothingNeckScarfStripedRed
    - ClothingSelectorClothingNeckScarfStripedGreen
    - ClothingSelectorClothingNeckScarfStripedBlue
    - ClothingSelectorClothingNeckScarfStripedBlack
    - ClothingSelectorClothingNeckScarfStripedBrown
    - ClothingSelectorClothingNeckScarfStripedLightBlue
    - ClothingSelectorClothingNeckScarfStripedOrange
    - ClothingSelectorClothingNeckScarfStripedPurple

